<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Personal Recipes</title>
  <meta name="description" content="A personal recipe collection for everyday meals, comfort food, and reliable home cooking." />
  <meta name="robots" content="index, follow" />
  <link rel="canonical" href="https://schrammr.github.io/Robins-Cookbook.github.io/" />

  <meta property="og:type" content="website" />
  <meta property="og:title" content="Personal Recipes" />
  <meta property="og:description" content="A personal recipe collection for everyday meals, comfort food, and reliable home cooking." />
  <meta property="og:url" content="https://schrammr.github.io/Robins-Cookbook.github.io/" />
  <meta property="og:image" content="https://images.unsplash.com/photo-1512621776951-a57141f2eefd?auto=format&fit=crop&w=1200&q=80" />

  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Personal Recipes" />
  <meta name="twitter:description" content="A personal recipe collection for everyday meals, comfort food, and reliable home cooking." />
  <meta name="twitter:image" content="https://images.unsplash.com/photo-1512621776951-a57141f2eefd?auto=format&fit=crop&w=1200&q=80" />

  <link rel="icon" type="image/svg+xml" href="Assets/cookbook-favicon.svg" />
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Lora:ital,wght@0,400;0,600;1,400;1,600&display=swap"
    rel="stylesheet"
  />
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Personal Recipes",
      "url": "https://schrammr.github.io/Robins-Cookbook.github.io/",
      "description": "A personal recipe collection for everyday meals, comfort food, and reliable home cooking."
    }
  </script>
</head>
<body>
  <header id="site-header">
    <nav class="nav-container" aria-label="Main navigation">
      <a href="#hero" class="nav-logo">Personal Recipes</a>
      <ul class="nav-links" id="siteNavLinks">
        <li><a href="#recipes">Recipes</a></li>
      </ul>
      <button class="nav-burger" id="navBurger" aria-label="Toggle menu" aria-controls="siteNavLinks" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
    </nav>
  </header>

  <main>
    <section id="hero" class="hero-section">
      <div class="hero-inner">
        <div class="hero-copy">
          <form class="hero-search" role="search" aria-label="Search recipes">
            <label for="recipeSearch">Find a recipe</label>
            <div class="search-row">
              <input id="recipeSearch" type="search" placeholder="Search lentils, tofu, pasta..." autocomplete="off" />
              <a class="btn btn-primary" href="#recipes">Browse</a>
            </div>
          </form>
          <dl class="hero-stats" aria-label="Cookbook overview">
            <div>
              <dt id="recipeCount">0</dt>
              <dd>recipes</dd>
            </div>
            <div>
              <dt>100%</dt>
              <dd>vegan</dd>
            </div>
            <div>
              <dt>33</dt>
              <dd>min average</dd>
            </div>
          </dl>
        </div>
      </div>
    </section>

    <section id="recipes" class="recipes-section">
      <div class="section-inner">
        <div class="section-heading">
          <div>
            <h2 class="section-title">Recipes</h2>
            <p class="section-subtitle">Weeknight staples, weekend projects, and sweet things worth repeating.</p>
          </div>
          <label class="sort-control" for="recipeSort">
            <span>Sort</span>
            <select id="recipeSort" aria-label="Sort recipes">
              <option value="favorite">Favorites first</option>
              <option value="time">Fastest first</option>
              <option value="name">A-Z</option>
            </select>
          </label>
        </div>

        <div class="filter-bar" id="categoryFilters" aria-label="Filter recipes by category"></div>
        <div class="recipe-grid" id="recipeGrid"></div>
      </div>
    </section>

  </main>

  <footer>
    <p>© <span id="footerYear"></span> Personal Recipes.</p>
  </footer>

  <div class="recipe-modal" id="recipeModal" role="dialog" aria-modal="true" aria-labelledby="modalTitle" hidden>
    <div class="modal-backdrop" data-close-modal></div>
    <article class="modal-card">
      <button class="modal-close" type="button" aria-label="Close recipe" data-close-modal>×</button>
      <img id="modalImage" alt="" />
      <div class="modal-body">
        <div class="modal-meta" id="modalMeta"></div>
        <h2 id="modalTitle"></h2>
        <p id="modalDescription"></p>
        <div class="modal-columns">
          <div>
            <h3>Ingredients</h3>
            <ul id="modalIngredients"></ul>
          </div>
          <div>
            <h3>Method</h3>
            <ol id="modalSteps"></ol>
          </div>
        </div>
      </div>
    </article>
  </div>

  <script src="script.js"></script>
</body>
</html>
